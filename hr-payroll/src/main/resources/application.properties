spring.application.name=hr-payroll
server.port=8101

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

resilience4j.circuitbreaker.instances.defaultCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.defaultCB.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.defaultCB.slowCallDurationThreshold=2000
resilience4j.circuitbreaker.instances.defaultCB.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.defaultCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.defaultCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.defaultCB.waitDurationInOpenState=10s